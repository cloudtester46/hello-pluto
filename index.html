<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello Pluto</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="scene" aria-label="Hello Pluto welcome page">
    <section class="card">
      <div class="stars" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="pluto" aria-hidden="true">
        <div class="heart"></div>
        <div class="eye eye-left"></div>
        <div class="eye eye-right"></div>
        <div class="smile"></div>
      </div>
      <p class="kicker">a tiny hello from far away</p>
      <h1>Hello Pluto</h1>
      <p class="message">Welcome to a calm little corner of space, where Pluto glows, stars twinkle, and hello.world feels wonderfully small.</p>
    </section>
  </main>
</body>
</html>
